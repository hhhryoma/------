<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excel の差分</title>
<!--
  Compare-Excel.ps1 -OutHtml のひな形。script の中の「var DATA = 」の所に差分のデータ（JSON）を入れて保存する。
  外部のファイル・通信を使わないので、社内の PC のブラウザーでそのまま開ける。
-->
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --line: #d9dde3; --text: #1f2328; --muted: #656d76; --accent: #217346;
    --chg: #ffeb9c; --add: #c6efce; --del: #ffc7ce; --mov: #ddebf7; --fmt: #e4dfec; --hist: #fce4d6;
    --grid: #e3e6ea; --head: #f0f2f4; --focus: #e8590c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 "Yu Gothic UI", "Meiryo UI", "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { background: var(--accent); color: #fff; padding: 8px 14px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .paths { font-size: 12px; opacity: .9; display: flex; flex-direction: column; min-width: 0; }
  header .paths span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
  header .summary { margin-left: auto; font-size: 12px; }
  .layout { flex: 1; display: grid; grid-template-columns: 260px 1fr; min-height: 0; }
  nav { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 8px 0; }
  nav .file { padding: 6px 12px 2px; font-weight: 600; word-break: break-all; }
  nav .file small { font-weight: normal; color: var(--muted); margin-left: 4px; }
  nav .sheet { display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 22px; cursor: pointer; border-left: 3px solid transparent; }
  nav .sheet:hover { background: #eef3ef; }
  nav .sheet.active { background: #e2efe6; border-left-color: var(--accent); }
  nav .sheet .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav .badge { font-size: 11px; border-radius: 9px; padding: 0 7px; background: var(--chg); color: #5c4a00; }
  nav .badge.zero { background: #eceff1; color: var(--muted); }
  nav .badge.add { background: var(--add); color: #155724; }
  nav .badge.del { background: var(--del); color: #8a1c24; }
  nav .note { padding: 2px 12px 6px 22px; color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; min-width: 0; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .toolbar .group { display: flex; align-items: center; gap: 4px; }
  .toolbar button { font: inherit; border: 1px solid var(--line); background: #fff; padding: 3px 10px; border-radius: 4px; cursor: pointer; }
  .toolbar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toolbar label { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
  .legend span { display: inline-block; padding: 0 6px; border: 1px solid var(--line); border-radius: 3px; margin-right: 3px; font-size: 12px; }
  .panes { display: grid; grid-template-columns: 1fr; min-height: 0; min-width: 0; }
  .panes.both { grid-template-columns: 1fr 1fr; }
  .pane { display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; border-right: 1px solid var(--line); }
  .pane .title { padding: 4px 10px; background: var(--head); border-bottom: 1px solid var(--line); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pane .title .side { display: inline-block; min-width: 2.5em; color: var(--muted); font-weight: normal; }
  .pane .scroll { overflow: auto; background: #fff; position: relative; }
  .pane .empty { padding: 24px; color: var(--muted); }
  table.grid { border-collapse: collapse; table-layout: fixed; font-size: 12px; }
  table.grid th { background: var(--head); color: var(--muted); font-weight: normal; border: 1px solid var(--grid); position: sticky; z-index: 2; }
  table.grid thead th { top: 0; height: 20px; }
  table.grid tbody th { left: 0; text-align: right; padding: 0 4px; z-index: 3; }
  table.grid thead th.corner { left: 0; z-index: 4; }
  table.grid td { border: 1px solid var(--grid); height: 20px; padding: 0 2px; white-space: pre; overflow: hidden; text-overflow: ellipsis; vertical-align: top; }
  table.grid td.ov { overflow: visible; text-overflow: clip; }
  table.grid td.chg { background: var(--chg); }
  table.grid td.add, table.grid tr.add td { background: var(--add); }
  table.grid td.del, table.grid tr.del td { background: var(--del); }
  table.grid td.mov, table.grid tr.mov td { background: var(--mov); }
  table.grid td.fmt { background: var(--fmt); }
  table.grid td.hist { background: var(--hist); }
  table.grid.whole-add tbody td { background: var(--add); }
  table.grid.whole-del tbody td { background: var(--del); }
  table.grid td.colmark { box-shadow: inset 0 0 0 9999px rgba(198, 239, 206, .45); }
  table.grid td.colmark.del { box-shadow: inset 0 0 0 9999px rgba(255, 199, 206, .55); }
  table.grid td.mark { cursor: help; }
  table.grid td.gap, table.grid tr.gap th, table.grid thead th.gap, .legend .gapchip { background: repeating-linear-gradient(135deg, #f4f5f7 0 4px, #e6e9ed 4px 8px); }
  table.grid thead th.hid { color: #a0a7b0; font-style: italic; }
  table.grid tr.skip td { background: #f6f7f9; color: var(--muted); padding: 2px 0; overflow: visible; }
  table.grid tr.skip td span { display: inline-block; position: sticky; left: 56px; padding: 0 8px; }
  table.grid td.focus { outline: 3px solid var(--focus); outline-offset: -2px; animation: blink 1.2s ease-out 2; }
  @keyframes blink { 50% { outline-color: transparent; } }
  .banner { padding: 6px 10px; background: #fff3cd; border-bottom: 1px solid var(--line); }
  .list { max-height: 34vh; overflow: auto; background: var(--panel); border-top: 2px solid var(--line); }
  .list table { width: 100%; border-collapse: collapse; }
  .list th, .list td { text-align: left; padding: 3px 8px; border-bottom: 1px solid #eef0f2; vertical-align: top; }
  .list th { position: sticky; top: 0; background: var(--head); font-weight: 600; z-index: 1; }
  .list tr.item { cursor: pointer; }
  .list tr.item:hover { background: #f3f8f4; }
  .list tr.item.current { background: #fff1e6; }
  .list td.val { max-width: 30vw; white-space: pre-wrap; word-break: break-all; }
  .list th, .list td { white-space: nowrap; }
  .list td.note { width: 28%; }
  .list td.rv select { font: inherit; padding: 1px 2px; }
  .list td.note input { font: inherit; width: 100%; min-width: 14em; padding: 1px 4px; border: 1px solid var(--line); border-radius: 3px; }
  .list tr.ok td { color: var(--muted); }
  .list tr.ok td.val ins, .list tr.ok td.val del { opacity: .6; }
  .list tr.issue td.rv select, .list tr.issue td.note input { border-color: #c0392b; background: #fdecea; }
  nav .badge.done { background: var(--add); color: #155724; }
  #review { font-size: 12px; }
  .chip { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 11px; }
  .chip.chg { background: var(--chg); } .chip.add { background: var(--add); } .chip.del { background: var(--del); }
  .chip.mov { background: var(--mov); } .chip.fmt { background: var(--fmt); } .chip.hist { background: var(--hist); }
  del { background: #ffc7ce; color: #8a1c24; text-decoration: line-through; }
  ins { background: #c6efce; color: #155724; text-decoration: none; font-weight: 600; }
  #tip { position: fixed; z-index: 20; max-width: 520px; background: #fff; border: 1px solid var(--line); box-shadow: 0 4px 16px rgba(0,0,0,.15); border-radius: 6px; padding: 8px 10px; display: none; pointer-events: none; font-size: 12px; }
  #tip .row { display: grid; grid-template-columns: 3em 1fr; gap: 4px; margin: 2px 0; }
  #tip .row b { color: var(--muted); font-weight: normal; }
  #tip .v { white-space: pre-wrap; word-break: break-all; }
  #tip hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Excel の差分</h1>
  <div class="paths"><span id="oldPath"></span><span id="newPath"></span></div>
  <div class="summary" id="summary"></div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main>
    <div class="toolbar">
      <div class="group" id="modes">
        <button data-mode="new" class="on" title="新のシートを表示（変更・追加したセルに色）">新</button>
        <button data-mode="old" title="旧のシートを表示（変更・削除したセルに色）">旧</button>
        <button data-mode="both" title="旧と新を左右に並べる（対応する行・列をそろえ、スクロールは連動）">左右に並べる</button>
      </div>
      <div class="group">
        <button id="prev" title="前の差分（k）">▲ 前</button>
        <button id="next" title="次の差分（j）">▼ 次</button>
        <span id="pos" class="muted"></span>
      </div>
      <div class="group" id="review"><span id="progress" class="muted"></span><button id="saveCsv" title="「指摘」にした差分（またはメモを書いた差分）を、指摘管理表の形の CSV に保存します（Measure-ReviewQuality.ps1 でそのまま集計できます）">指摘を CSV に保存</button></div>
      <div class="group"><label title="差分のある行と、その前後 2 行だけを表示（大きなシートで便利）"><input type="checkbox" id="compact">変わった行だけ</label></div>
      <div class="group" id="kinds"></div>
      <div class="group legend"><span style="background:var(--chg)">変更</span><span style="background:var(--add)">追加</span><span style="background:var(--del)">削除</span><span style="background:var(--mov)">移動</span><span style="background:var(--fmt)">書式</span><span class="gapchip" id="gapLegend" title="片方にしか無い行・列の、もう片方の側">対応なし</span></div>
    </div>
    <div class="panes" id="panes"></div>
    <div class="list" id="list"></div>
  </main>
</div>
<div id="tip"></div>
<script>
var DATA = /*DIFF_DATA*/null;
(function () {
  'use strict';
  // 描く列の上限・1 画面に描くセルの上限・開いたときに「変わった行だけ」にするセルの数・「変わった行だけ」で前後に見せる行数
  var MAX_COLS = 300, MAX_CELLS = 150000, BIG_SHEET = 40000, CONTEXT = 2;
  var state = { file: -1, sheet: -1, mode: 'new', compact: false, hidden: {}, items: [], index: -1 };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var colName = function (n) { var s = ''; while (n > 0) { var m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  var colIndex = function (s) { var n = 0; for (var i = 0; i < s.length; i++) n = n * 26 + s.charCodeAt(i) - 64; return n; };
  var parseCell = function (a) { var m = /^([A-Z]+)(\d+)$/.exec(a || ''); return m ? { r: +m[2], c: colIndex(m[1]) } : null; };
  // セル（A1）と範囲（A5:F5）を、左上と右下の行・列にする
  var parseRef = function (a) {
    var x = String(a || '').split(':'), p = parseCell(x[0]), q = parseCell(x[1] || x[0]);
    return p && q ? { r1: Math.min(p.r, q.r), c1: Math.min(p.c, q.c), r2: Math.max(p.r, q.r), c2: Math.max(p.c, q.c) } : null;
  };
  var each = function (list, fn) { Array.prototype.forEach.call(list, fn); };
  var cls = function (d, side) {
    if (d.k === '書式') return 'fmt';
    if (d.k === '改訂履歴') return 'hist';
    if (d.ch === '追加') return side === 'old' ? 'chg' : 'add';
    if (d.ch === '削除') return side === 'new' ? 'chg' : 'del';
    if (d.ch === '移動') return 'mov';
    return 'chg';
  };

  var chip = function (d) { return cls(d, d.ch === '削除' ? 'old' : 'new'); };

  // レビューの記録（差分ごとの 確認: ok / issue と、指摘のメモ）。このブラウザーに残し、開き直しても消えない
  var notes = {}, storeKey = DATA ? 'compare-excel-review|' + DATA.old + '|' + DATA['new'] + '|' + DATA.created : '';
  try { notes = JSON.parse(localStorage.getItem(storeKey) || '{}') || {}; } catch (e) { notes = {}; }
  var saveNotes = function () { try { localStorage.setItem(storeKey, JSON.stringify(notes)); } catch (e) { } };
  var noteOf = function (d) { return notes[d.key] || {}; };

  if (!DATA) { document.body.innerHTML = '<p style="padding:24px">差分のデータがありません。Compare-Excel.ps1 -OutHtml で作ってください。</p>'; return; }
  $('oldPath').textContent = '旧: ' + DATA.old;
  $('newPath').textContent = '新: ' + DATA.new;
  var total = 0, changed = 0;
  DATA.files.forEach(function (f) { total += f.count; if (f.count > 0) changed++; });
  $('summary').textContent = DATA.files.length + ' ファイル（差分のあるファイル ' + changed + '）・差分 ' + total + ' 件・' + DATA.created;

  DATA.files.forEach(function (f, fi) { f.diffs.forEach(function (d, di) { d.key = fi + '-' + di; d.file = f.name; }); });

  // 種類の絞り込み
  var kinds = {};
  DATA.files.forEach(function (f) { f.diffs.forEach(function (d) { if (d.k !== 'ファイル') kinds[d.k] = (kinds[d.k] || 0) + 1; }); });
  $('kinds').innerHTML = Object.keys(kinds).map(function (k) { return '<label><input type="checkbox" checked data-kind="' + esc(k) + '">' + esc(k) + '</label>'; }).join('');
  $('kinds').addEventListener('change', function (e) {
    state.hidden[e.target.getAttribute('data-kind')] = !e.target.checked;
    // 見ていた差分が残っていれば、その差分を見たままにする
    var cur = state.items[state.index];
    show();
    state.index = state.items.indexOf(cur);
    if (state.index >= 0) focusItem(); else updatePos();
  });
  $('compact').addEventListener('change', function (e) { state.compact = e.target.checked; show(); if (state.index >= 0) focusItem(); });

  // 左: ファイルとシート
  var nav = $('nav'), html = '';
  DATA.files.forEach(function (f, fi) {
    html += '<div class="file">' + esc(f.name) + '<small>' + esc(f.state) + '</small></div>';
    if (f.sheets.length === 0) {
      var notes = f.diffs.map(function (d) { return esc(d.d); });
      html += '<div class="note">' + (notes.length ? notes.join('<br>') : '差分なし') + '</div>';
      return;
    }
    f.sheets.forEach(function (s, si) {
      var n = sheetDiffs(f, s).length;
      var badge = !s.oldName ? 'add' : !s.name ? 'del' : n ? '' : 'zero';
      var label = s.name || s.oldName;
      if (s.name && s.oldName && s.name !== s.oldName) label = s.oldName + ' → ' + s.name;
      html += '<div class="sheet" data-f="' + fi + '" data-s="' + si + '" title="' + esc(label) + '"><span class="name">' + esc(label) + '</span><span class="badge ' + badge + '" data-n="' + n + '">' + (!s.oldName ? '追加' : !s.name ? '削除' : n) + '</span></div>';
    });
  });
  nav.innerHTML = html;
  nav.addEventListener('click', function (e) {
    var el = e.target.closest('.sheet');
    if (el) select(+el.getAttribute('data-f'), +el.getAttribute('data-s'));
  });

  function sheetDiffs(f, s) {
    return f.diffs.filter(function (d) {
      if (d.k === 'ファイル') return false;
      return (s.name && d.s === s.name) || (!s.name && s.oldName && (d.os === s.oldName || d.s === s.oldName));
    });
  }

  // 表示の切り替え
  function setMode(m) {
    state.mode = m;
    each($('modes').children, function (b) { b.classList.toggle('on', b.getAttribute('data-mode') === m); });
  }
  $('modes').addEventListener('click', function (e) {
    var m = e.target.getAttribute('data-mode');
    if (!m) return;
    setMode(m);
    show();
    if (state.index >= 0) focusItem();
  });
  $('prev').addEventListener('click', function () { go(-1); });
  $('next').addEventListener('click', function () { go(1); });
  document.addEventListener('keydown', function (e) {
    // Ctrl+P（印刷）などはブラウザーに任せる
    if (e.ctrlKey || e.metaKey || e.altKey || /^(SELECT|TEXTAREA)$/.test(e.target.tagName) || (e.target.tagName === 'INPUT' && e.target.type !== 'checkbox')) return;
    if (e.key === 'j' || e.key === 'n') go(1);
    if (e.key === 'k' || e.key === 'p') go(-1);
    // o: 見ている差分を OK にして次へ
    if (e.key === 'o' && state.items[state.index]) { setNote(state.items[state.index], { st: 'ok' }); var sel = document.querySelector('#list tr.item[data-i="' + state.index + '"] select'); if (sel) sel.value = 'ok'; go(1); }
  });

  function select(fi, si) {
    state.file = fi; state.sheet = si; state.index = -1;
    // 大きなシートは、描くのに時間がかかるので「変わった行だけ」で開く
    var s = DATA.files[fi].sheets[si], big = [s['new'], s.oldSheet].some(function (x) { return x && x.rows * Math.min(x.cols, MAX_COLS) > BIG_SHEET; });
    if (big && !state.compact) { state.compact = true; $('compact').checked = true; }
    // 片方にしか無いシートは、あるほうを表示する
    if (state.mode === 'new' && !s.name) setMode('old');
    if (state.mode === 'old' && !s.oldName) setMode('new');
    each(nav.querySelectorAll('.sheet'), function (el) {
      el.classList.toggle('active', +el.getAttribute('data-f') === fi && +el.getAttribute('data-s') === si);
    });
    show();
    // 最初の差分のセルを見せる
    if (state.items.some(function (d) { return d.nc || d.oc; })) go(1);
  }

  function show() {
    var f = DATA.files[state.file], s = f && f.sheets[state.sheet];
    var panes = $('panes');
    if (!s) { panes.innerHTML = '<div class="pane"><div class="empty">左の一覧からシートを選んでください。</div></div>'; $('list').innerHTML = ''; return; }
    state.items = sheetDiffs(f, s).filter(function (d) { return !state.hidden[d.k]; });
    if (state.index >= state.items.length) state.index = -1;
    var sheetDiff = state.items.filter(function (d) { return d.k === 'シート'; });
    var sides = state.mode === 'both' ? ['old', 'new'] : [state.mode];
    panes.className = 'panes' + (sides.length > 1 ? ' both' : '');
    panes.innerHTML = sides.map(function (side) {
      var name = side === 'new' ? s.name : s.oldName;
      return '<div class="pane"><div class="title"><span class="side">' + (side === 'new' ? '新' : '旧') + '</span>' + esc(name || '（このシートはありません）') + '</div><div class="scroll" id="scroll-' + side + '"></div></div>';
    }).join('');
    var infos = {};
    sides.forEach(function (side) { infos[side] = sideInfo(side === 'new' ? s['new'] : s.oldSheet, side); });
    // 左右に並べるときは、対応する行・列を同じ高さ・位置にそろえる（片方にしか無い行・列は空けておく）
    var shared = null;
    if (sides.length > 1 && infos.old && infos['new']) {
      shared = { rows: align(s.rp, infos.old.rows, infos['new'].rows, infos.old.rowHas, infos['new'].rowHas),
        cols: align(s.cp, infos.old.cols, infos['new'].cols, infos.old.colHas, infos['new'].colHas) };
    }
    sides.forEach(function (side) {
      var box = $('scroll-' + side);
      var banner = sheetDiff.map(function (d) { return '<div class="banner">' + esc(d.d) + '</div>'; }).join('');
      var info = infos[side];
      if (!info) { box.innerHTML = banner + '<div class="empty">' + (side === 'new' ? '新' : '旧') + 'にはこのシートがありません。</div>'; return; }
      var view = shared || { rows: range(info.rows, side), cols: range(info.cols, side) };
      box.innerHTML = banner + renderGrid(info, side, view, shared ? [infos.old, infos['new']] : [info], sides.length);
    });
    $('gapLegend').style.display = shared ? '' : 'none';
    if (sides.length > 1) syncScroll($('scroll-old'), $('scroll-new'));
    renderList();
    updatePos();
  }

  function range(n, side) { var out = []; for (var i = 1; i <= n; i++) { var e = {}; e[side] = i; out.push(e); } return out; }

  // シートの中の差分の印（セル・行・列）と、描く範囲
  function sideInfo(sheet, side) {
    if (!sheet) return null;
    var info = { side: side, sheet: sheet, whole: '', marks: {}, rowMarks: {}, colMarks: {}, markRows: {}, markCols: {}, tips: {}, rows: sheet.rows, cols: sheet.cols, rowHas: {}, colHas: {}, merges: [] };
    Object.keys(sheet.c).forEach(function (k) { var x = k.split(','); info.rowHas[x[0]] = true; info.colHas[x[1]] = true; });
    state.items.forEach(function (d, i) {
      // 追加・削除したシートは、全体に色を付ける
      if (d.k === 'シート' && (d.ch === '追加' || d.ch === '削除')) info.whole = d.ch === '追加' ? 'add' : 'del';
      var ref = parseRef(side === 'new' ? d.nc : d.oc);
      if (!ref) return;
      info.rows = Math.max(info.rows, ref.r2);
      info.markRows[ref.r1] = true;
      if (d.k === '行') { for (var r = ref.r1; r <= ref.r2; r++) { info.rowMarks[r] = cls(d, side); info.markRows[r] = true; } return; }
      info.cols = Math.max(info.cols, ref.c2);

  // 旧と新の行（または列）をそろえて並べる。pairs は対応付けた [旧, 新] の組。
  // 組の間に残った行は、数が同じなら順に並べ、違えば中身のある行を片側だけの行にする
  function align(pairs, oMax, nMax, oHas, nHas) {
    var out = [], i, r;

      .sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });

      else {

          if (x < O.length && y < N.length && !oHas[O[x]] && !nHas[N[y]]) out.push({ old: O[x++], 'new': N[y++] });
          else if (x < O.length && (oHas[O[x]] || y >= N.length)) out.push({ old: O[x++], 'new': null });
          else out.push({ old: null, 'new': N[y++] });

  // 最長増加部分列の添字（対応付けの組のうち、順序が入れ替わっていないもの）

  }

  // シートの方眼（列幅・結合セルを反映し、差分のセル・行・列に色を付ける）
  function renderGrid(info, side, view, all, paneCount) {
    var sheet = info.sheet, rows = view.rows, cols = view.cols, notes = [];
    if (cols.length > MAX_COLS) { cols = cols.slice(0, MAX_COLS); notes.push(MAX_COLS + ' 列'); }
    // 変わった行の前後だけを残し、間は「… n 行 …」にまとめる
    if (state.compact) {
      var near = [], keep = [];
      rows.forEach(function (e, i) {
        var hit = (e.old == null || e['new'] == null) && all.length > 1;
        all.forEach(function (x) { if (e[x.side] != null && x.markRows[e[x.side]]) hit = true; });
        if (hit) for (var k = Math.max(0, i - CONTEXT); k <= Math.min(rows.length - 1, i + CONTEXT); k++) near[k] = true;
      });

    var widths = cols.map(function (e) {
      var w = 0, marked = false;
      all.forEach(function (x) {
        var c = e[x.side];
        if (c == null) return;

    rows.forEach(function (e, i) { if (e[side] != null) rowAt[e[side]] = i; });

    info.merges.forEach(function (g) {
      var i0 = first(rows, rowAt, side, g.r1, g.r2), j0 = first(cols, colAt, side, g.c1, g.c2);
      if (i0 < 0 || j0 < 0) return;

      for (var i = i0; i <= i1; i++) for (var j = j0; j <= j1; j++) if (i !== i0 || j !== j0) covered[i + ',' + j] = true;
    });

    var total = 44;
    widths.forEach(function (x) { total += x.w; });
    // 列幅どおりに並べるため、表の幅を列幅の合計にする（table-layout: fixed は幅の指定が要る）
    var out = ['<table class="grid' + (info.whole ? ' whole-' + info.whole : '') + '" data-side="' + side + '" style="width:' + total + 'px"><colgroup><col style="width:44px">'];

    out.push('</colgroup><thead><tr><th class="corner"></th>');
    cols.forEach(function (e, j) {
      var c = e[side];

      var r = e[side];
      out.push('<tr' + (r == null ? ' class="gap"' : info.rowMarks[r] ? ' class="' + info.rowMarks[r] + '"' : '') + '><th>' + (r == null ? '' : r) + '</th>');

        if (covered[i + ',' + j]) return;

        var sp = spans[i + ',' + j], key = sp ? sp.key : r + ',' + c;
        var text = sheet.c[key], mark = sp ? sp.mark : info.marks[key], tip = sp ? sp.tip : info.tips[key], klass = [];
        if (mark) klass.push(mark, 'mark');

          (sp ? ' rowspan="' + sp.rs + '" colspan="' + sp.cs + '"' : '') + (tip && tip.length ? ' data-tip="' + tip.join(' ') + '"' : '') + '>' + (text == null ? '' : esc(text)) + '</td>');

  // 結合セルの範囲 [lo, hi] のうち、表示している最初の行（列）の位置

  // 下: 差分の一覧（クリックで該当のセルへ）
  function renderList() {
    var rows = state.items.map(function (d, i) {
      var where = d.nc ? (d.s + '!' + d.nc) : d.oc ? ((d.os || d.s) + '!' + d.oc + '（旧）') : d.s;

        '</td><td><span class="chip ' + chip(d) + '">' + esc(d.ch) + '</span></td><td class="val">' + d.ho + '</td><td class="val">' + d.hn + '</td>' +

  $('list').addEventListener('click', function (e) {

  });
  // 確認・指摘の内容を書いたら、すぐに残す（指摘の内容を書けば「指摘」にする）
  $('list').addEventListener('change', function (e) {

  $('list').addEventListener('input', function (e) {

  });

  function setNote(d, patch) {
    var n = notes[d.key] || {};
    for (var k in patch) n[k] = patch[k];
    if (!n.st && !(n.text || '').trim()) delete notes[d.key]; else notes[d.key] = n;
    saveNotes();
    var tr = document.querySelector('#list tr.item[data-i="' + state.items.indexOf(d) + '"]');
    if (tr) { tr.classList.toggle('ok', n.st === 'ok'); tr.classList.toggle('issue', n.st === 'issue'); }
    updateProgress();
  }

  // 確認の進み具合（レビューできる差分 = シートを表示できるファイルの、ファイル以外の差分）
  function reviewable() {
    var out = [];
    DATA.files.forEach(function (f) { if (f.sheets.length) f.diffs.forEach(function (d) { if (d.k !== 'ファイル') out.push(d); }); });
    return out;
  }
  function updateProgress() {
    var all = reviewable(), done = 0, issues = 0;
    all.forEach(function (d) { var n = noteOf(d); if (n.st) done++; if (n.st === 'issue') issues++; });
    $('progress').textContent = all.length ? '確認 ' + done + ' / ' + all.length + ' 件・指摘 ' + issues + ' 件' : '';
    $('saveCsv').disabled = issues === 0;
    // シートの一覧: すべて確認したシートは緑にする
    each(nav.querySelectorAll('.sheet'), function (el) {
      var f = DATA.files[+el.getAttribute('data-f')], s = f.sheets[+el.getAttribute('data-s')], ds = sheetDiffs(f, s);
      var badge = el.querySelector('.badge');

    });
  }

  // 指摘を、指摘管理表の形の CSV（Excel で開ける UTF-8）に保存する
  $('saveCsv').addEventListener('click', function () {
    var pad = function (x) { return (x < 10 ? '0' : '') + x; }, now = new Date();
    var today = now.getFullYear() + '/' + pad(now.getMonth() + 1) + '/' + pad(now.getDate());
    var q = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
    var lines = [['No', '設計書', 'シート', '場所', '種類', '変更', '変更前', '変更後', '指摘内容', '分類', '重要度', '状態', '起票日', '期限', '完了日', '対応者'].map(q).join(',')];
    var no = 0;
    reviewable().forEach(function (d) {
      var n = noteOf(d);
      if (n.st !== 'issue') return;
      var cell = d.nc || (d.oc ? d.oc + '（旧）' : '');
      var text = (n.text || '').trim() || ('差分を確認してください: ' + d.d);
      lines.push([++no, d.file, d.s || d.os, cell, d.k, d.ch, d.a, d.b, text, '', '', '未対応', today, '', '', ''].map(q).join(','));
    });

  });

  function updatePos() {

  }

  function go(step) {

  // 差分のセルの要素（結合セルの中なら、結合セルの左上）。描いていなければ null

  function focusItem() {

  // マウスを重ねたセルの変更前・変更後（変わった文字に色）

    var seen = {};
    tip.innerHTML = td.getAttribute('data-tip').split(' ').filter(function (i) { if (seen[i]) return false; seen[i] = true; return state.items[+i]; }).map(function (i) {
      var d = state.items[+i];

  // 文字単位の差分（短い文字は LCS。長すぎる文字はそのまま）
  function diffHtml(a, b, side) {

    var n = a.length, m = b.length, dp = [];

    for (i = n - 1; i >= 0; i--) for (var j = m - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);

    while (i < n || j < m) {
      if (i < n && j < m && a[i] === b[j]) { put('', a[i]); i++; j++; }
      else if (j < m && (i === n || dp[i][j + 1] >= dp[i + 1][j])) { if (side === 'new') put('ins', b[j]); j++; }
      else { if (side === 'old') put('del', a[i]); i++; }
    }
    flush();
    return out;
  }

  updateProgress();
  // 最初の差分のあるシートを開く
  for (var fi = 0; fi < DATA.files.length; fi++) {
    var f = DATA.files[fi];
    for (var si = 0; si < f.sheets.length; si++) { if (sheetDiffs(f, f.sheets[si]).length) { select(fi, si); return; } }
  }
  if (DATA.files.length && DATA.files[0].sheets.length) select(0, 0); else show();
})();
</script>
